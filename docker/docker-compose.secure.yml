name: messages-kafka-secure
services:
  controller1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: controller1
    restart: unless-stopped
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: '1'
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
    - controller1_data:/var/lib/kafka/data
    - ./secrets/controller1.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  controller2:
    image: confluentinc/cp-kafka:7.5.0
    hostname: controller2
    restart: unless-stopped
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: '2'
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
    - controller2_data:/var/lib/kafka/data
    - ./secrets/controller2.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  controller3:
    image: confluentinc/cp-kafka:7.5.0
    hostname: controller3
    restart: unless-stopped
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: '3'
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
    - controller3_data:/var/lib/kafka/data
    - ./secrets/controller3.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  broker1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker1
    restart: unless-stopped
    depends_on:
    - controller1
    - controller2
    - controller3
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,EXTERNAL:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: '4'
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:29092:29092
    volumes:
    - broker1_data:/var/lib/kafka/data
    - ./secrets/broker1.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  broker2:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker2
    restart: unless-stopped
    depends_on:
    - controller1
    - controller2
    - controller3
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,EXTERNAL:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: '5'
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:29093:29093
    volumes:
    - broker2_data:/var/lib/kafka/data
    - ./secrets/broker2.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  broker3:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker3
    restart: unless-stopped
    depends_on:
    - controller1
    - controller2
    - controller3
    environment:
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,EXTERNAL:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/node.p12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_STORE_PASSWORD:?ejecuta scripts/bootstrap.sh}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:CN=admin;User:CN=controller1;User:CN=controller2;User:CN=controller3;User:CN=broker1;User:CN=broker2;User:CN=broker3
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: '6'
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?ejecuta scripts/bootstrap.sh}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:29094:29094
    volumes:
    - broker3_data:/var/lib/kafka/data
    - ./secrets/broker3.p12:/etc/kafka/secrets/node.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    networks:
    - kafka_secure
  # UI del clúster KRaft: se conecta por mTLS, no por PLAINTEXT.
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop-secure
    hostname: kafdrop
    restart: unless-stopped
    depends_on:
      - broker1
      - broker2
      - broker3
    ports:
      - "127.0.0.1:${KAFDROP_HOST_PORT:-9000}:9000"
    environment:
      KAFKA_BROKERCONNECT: broker1:9092,broker2:9092,broker3:9092
      KAFKA_PROPERTIES_FILE: /tmp/kafdrop.properties
      KAFKA_KEYSTORE_FILE: /tmp/kafdrop.p12
      KAFKA_TRUSTSTORE_FILE: /tmp/truststore.p12
      JVM_OPTS: "-Xms32M -Xmx64M"
      CMD_ARGS: "--topic.createEnabled=false --topic.deleteEnabled=false --message.sendEnabled=false"
    volumes:
      - ./secrets/kafdrop.p12:/tmp/kafdrop.p12:ro
      - ./secrets/truststore.p12:/tmp/truststore.p12:ro
      - ./secrets/kafdrop.properties:/tmp/kafdrop.properties:ro
    networks:
      - kafka_secure

  # ZooKeeper de compatibilidad. NO coordina este clúster KRaft.
  # Requiere --profile legacy-zookeeper; su puerto local predeterminado
  # es 32181 para no colisionar con tu ZooKeeper anterior en 2181.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-legacy-secure
    profiles:
      - legacy-zookeeper
    hostname: zookeeper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZOOKEEPER_LEGACY_HOST_PORT:-32181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_legacy_data:/var/lib/zookeeper/data
      - zookeeper_legacy_log:/var/lib/zookeeper/log
    networks:
      - kafka_secure

  admin:
    image: confluentinc/cp-kafka:7.5.0
    profiles:
    - ops
    hostname: kafka-admin
    volumes:
    - ./secrets/admin.p12:/etc/kafka/secrets/admin.p12:ro
    - ./secrets/truststore.p12:/etc/kafka/secrets/truststore.p12:ro
    - ./secrets/admin.properties:/etc/kafka/secrets/admin.properties:ro
    networks:
    - kafka_secure
networks:
  kafka_secure:
    name: messages-kafka-secure
    driver: bridge
volumes:
  controller1_data: {}
  controller2_data: {}
  controller3_data: {}
  broker1_data: {}
  broker2_data: {}
  broker3_data: {}
  zookeeper_legacy_data: {}
  zookeeper_legacy_log: {}
