spring.application.name=messages
# Servidor HTTP

server.port=8081
# El servicio expuesto a LAN debe tener autenticacion HTTP y HTTPS/ingress, NO solo Kafka seguro.
server.address=127.0.0.1
spring.kafka.bootstrap-servers=localhost:29092,localhost:29093,localhost:29094
spring.kafka.properties[security.protocol]=SSL
spring.kafka.properties[ssl.keystore.type]=PKCS12
spring.kafka.properties[ssl.keystore.location]=${KAFKA_KEYSTORE_PATH}
spring.kafka.properties[ssl.keystore.password]=${KAFKA_STORE_PASSWORD}
spring.kafka.properties[ssl.key.password]=${KAFKA_STORE_PASSWORD}
spring.kafka.properties[ssl.truststore.type]=PKCS12
spring.kafka.properties[ssl.truststore.location]=${KAFKA_TRUSTSTORE_PATH}
spring.kafka.properties[ssl.truststore.password]=${KAFKA_STORE_PASSWORD}
spring.kafka.properties[ssl.endpoint.identification.algorithm]=https
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=120000
# Rendimiento inicial
spring.kafka.producer.properties[batch.size]=16384
spring.kafka.producer.properties[linger.ms]=5
 #Seguridad para laboratorio local
#spring.kafka.properties[security.protocol]=PLAINTEXT
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=email-worker
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.admin.auto-create=false


